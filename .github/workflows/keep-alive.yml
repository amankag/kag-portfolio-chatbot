name: Keep Render Awake

on:
  schedule:
    # Runs every 10 minutes, every day. Render sleeps after 15 min idle,
    # so this keeps a comfortable margin against GitHub's scheduling drift.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging backend health endpoint..."
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://kag-portfolio-chatbot.onrender.com/health \
            || echo "Ping failed (backend may be redeploying or temporarily down)"
