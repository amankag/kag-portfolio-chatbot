
name: Keep Render Awake
 
on:
  schedule:
    # Runs every 10 minutes, offset to :03/:13/:23... to avoid the
    # congestion GitHub sees at round numbers (:00, :10, :20 etc, where
    # every repo's schedule collides). Render sleeps after 15 min idle,
    # so this still keeps a comfortable margin.
    - cron: '3-59/10 * * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging backend health endpoint..."
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://kag-portfolio-chatbot.onrender.com/health \
            || echo "Ping failed (backend may be redeploying or temporarily down)"
