name: Keep Render Awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail \
            --retry 3 \
            --retry-delay 5 \
            --max-time 90 \
            --show-error \
            "https://kag-portfolio-chatbot.onrender.com/health"
